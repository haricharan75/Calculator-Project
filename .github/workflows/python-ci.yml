name: Python CI Pipeline

on:
  push:
    branches:
      - main
      - feature/security-demo
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black
        run: black --check .

      - name: Run Pylint
        run: pylint calculator.py app.py

      - name: Run Tests
        run: pytest -v

      - name: Run Code Coverage
        run: pytest --cov=.